<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — FoodExpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="container">
            <a class="logo" href="index.html">🍕 FoodExpress</a>
            <div class="navbar-nav flex-row flex-wrap">
                <a class="nav-link" href="index.html">Главная</a>
                <a class="nav-link" href="menu.html">Меню</a>
                <a class="nav-link" href="delivery.html">Доставка</a>
                <a class="nav-link" href="promotions.html">Акции</a>
                <a class="nav-link" href="cart.html">🛒 Корзина</a>
            </div>
        </div>
    </nav>
</header>

<main class="container">

    <h1 class="section-title">🛒 Корзина</h1>

    <div class="row g-4">

        <section class="col-md-6">
            <div class="info-box">
                <h3>Ваш заказ</h3>

                <div class="d-flex justify-content-between border-bottom py-3">
                    <span>Пицца Пепперони</span>
                    <strong>550 сом</strong>
                </div>

                <div class="d-flex justify-content-between border-bottom py-3">
                    <span>Суши Филадельфия</span>
                    <strong>650 сом</strong>
                </div>

                <div class="d-flex justify-content-between border-bottom py-3">
                    <span>Доставка</span>
                    <strong>100 сом</strong>
                </div>

                <div class="cart-total mt-4">
                    <strong>Итого: 1300 сом</strong>
                </div>

                <p class="text-muted mt-3">
                    Это демонстрационный пример корзины.
                </p>

            </div>
        </section>

        <section class="col-md-6">
            <div class="info-box">
                <h3>Оформление заказа</h3>

                <form action="#" method="get">

                    <label class="form-label">Ваше имя</label>
                    <input type="text" class="form-control"
                           placeholder="Введите имя" required>

                    <label class="form-label">Номер телефона</label>
                    <input type="tel" class="form-control"
                           placeholder="+996 XXX XXX XXX" required>

                    <label class="form-label">Адрес доставки</label>
                    <textarea class="form-control" rows="3"
                              placeholder="Введите адрес" required></textarea>

                    <label class="form-label">Способ оплаты</label>
                    <select class="form-select mb-3" required>
                        <option value="">Выберите способ оплаты</option>
                        <option>Наличными</option>
                        <option>Банковской картой</option>
                    </select>

                    <label class="form-label">Комментарий к заказу</label>
                    <textarea class="form-control" rows="2"
                              placeholder="Дополнительная информация"></textarea>

                    <button type="submit" class="btn-food w-100 mt-3">
                        Оформить заказ
                    </button>

                </form>

            </div>
        </section>

    </div>

    <div class="text-center mt-4">
        <a href="menu.html" class="btn-food">Вернуться в меню</a>
    </div>

</main>

<footer>
    <p>© 2026 FoodExpress</p>
    <p>Спасибо, что выбираете нас!</p>
</footer>

</body>
</html>
